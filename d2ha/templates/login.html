{% extends "auth.html" %}
{% block title %}{{ t('login.title') }} · D2HA{% endblock %}
{% block heading %}{{ t('login.heading') }}{% endblock %}
{% block subheading %}{{ t('login.subheading') }}{% endblock %}
{% block content %}
<form method="post" class="stack-v" autocomplete="on">
  <input type="hidden" name="next" value="{{ next }}">
  <div class="field">
    <label for="username">{{ t('field.username') }}</label>
    <input class="input" id="username" name="username" autocomplete="username" autocapitalize="none" spellcheck="false" required autofocus>
  </div>
  <div class="field">
    <label for="password">{{ t('field.password') }}</label>
    <input class="input" id="password" name="password" type="password" autocomplete="current-password" required>
  </div>
  {% if totp %}
  <div class="field">
    <label for="code">{{ t('field.totp_code') }}</label>
    <input class="input" id="code" name="code" inputmode="numeric" pattern="[0-9 ]{6,7}" autocomplete="one-time-code" required>
  </div>
  {% endif %}
  <button class="btn btn-primary" type="submit">{{ t('login.submit') }}</button>
</form>
{% endblock %}
