name: Tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Install dependencies
        run: pip install -r d2ha/requirements.txt pytest pyflakes
      - name: Lint
        run: pyflakes d2ha tests
      - name: Tests
        run: pytest -q
