name: Build and Publish Docker image to GHCR

on:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Compute version and tags
        id: meta
        run: |
          RAW="${GITHUB_REF_NAME:-dev}"
          VERSION="${RAW#v}"
          TAGS="ghcr.io/arborae/docker2homeassistant:latest"
          if [ "${GITHUB_EVENT_NAME}" = "release" ]; then
            TAGS="$TAGS,ghcr.io/arborae/docker2homeassistant:${VERSION}"
          fi
          echo "tags=${TAGS}" >> "$GITHUB_OUTPUT"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Set up QEMU (arm64 images)
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v7
        with:
          context: ./d2ha
          file: ./d2ha/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          build-args: |
            D2HA_VERSION=${{ steps.meta.outputs.version }}
