name: Nightly Docker image (GHCR)

on:
  push:
    branches: [main]
    paths-ignore:
      - "docs/**"
      - "docs-site/**"
      - "**/*.md"
  workflow_dispatch:

jobs:
  build-and-push-nightly:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up QEMU (arm64 images)
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push nightly image
        uses: docker/build-push-action@v7
        with:
          context: ./d2ha
          file: ./d2ha/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/arborae/docker2homeassistant:nightly
            ghcr.io/arborae/docker2homeassistant:nightly-${{ github.sha }}
          build-args: |
            D2HA_VERSION=${{ github.sha }}
